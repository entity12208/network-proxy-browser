<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Proxy Browser</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="auth-screen" class="screen">
        <div class="auth-container">
          <h1>Network Proxy Browser</h1>
          <form id="login-form">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit">Login</button>
            <p id="auth-error" class="error"></p>
          </form>
        </div>
      </div>

      <div id="browser-screen" class="screen hidden">
        <div class="header">
          <div class="user-info">
            <span id="user-display"></span>
            <button id="logout-btn">Logout</button>
          </div>
        </div>

        <div class="browser-container">
          <div class="tab-bar">
            <div id="tabs-container" class="tabs-container"></div>
            <button id="new-tab-btn" class="new-tab-btn">+</button>
          </div>

          <div class="address-bar">
            <input
              type="text"
              id="url-input"
              placeholder="Enter URL..."
              class="url-input"
            />
            <button id="go-btn">Go</button>
            <div class="nav-buttons">
              <button id="back-btn" class="nav-btn">←</button>
              <button id="forward-btn" class="nav-btn">→</button>
              <button id="reload-btn" class="nav-btn">↻</button>
            </div>
          </div>

          <div class="browser-content">
            <iframe
              id="content-frame"
              class="content-frame"
              sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
            ></iframe>
          </div>

          <div class="status-bar">
            <span id="status-text">Ready</span>
          </div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/browser.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
